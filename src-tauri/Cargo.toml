[package]
name = "beat-wallpaper"
version = "0.2.0"
description = "音乐律动壁纸 - 随音乐跳动的桌面壁纸"
authors = ["BeatWallpaper Team"]
edition = "2021"

[lib]
name = "beat_wallpaper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
num-complex = "0.4"
image = "0.25"
once_cell = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
 
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
