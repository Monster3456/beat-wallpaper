name: 构建与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            update_key: darwin-aarch64
            artifact_glob: 'src-tauri/target/release/bundle/dmg/*.dmg'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            update_key: windows-x86_64
            artifact_glob: 'src-tauri/target/release/bundle/nsis/*.exe'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # npm 在本 runner 上有 "Exit handler never called!" 崩溃 bug，全程用 pnpm
      - name: Install dependencies (pnpm)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm install --no-frozen-lockfile

      - name: Install WiX (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          choco install wixtoolset -y --no-progress

      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build

      - name: Assemble update.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          KEY="${{ matrix.update_key }}"
          if [ "$KEY" = "darwin-aarch64" ]; then
            ARTIFACT=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          else
            ARTIFACT=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          fi
          # tauri build 已用签名密钥生成 .sig（构建步骤 env 已注入）
          SIGNATURE=$(cat "$ARTIFACT.sig")
          python3 - "$VERSION" "$TAG" "$KEY" "$SIGNATURE" "$(basename "$ARTIFACT")" <<'PYEOF'
          import json, sys, datetime
          version, tag, key, sig, fname = sys.argv[1:6]
          data = {
            "version": version,
            "notes": f"v{version} 自动构建发布",
            "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "platforms": {
              key: {
                "signature": sig,
                "url": f"https://github.com/Monster3456/beat-wallpaper/releases/download/{tag}/{fname}"
              }
            }
          }
          json.dump(data, open("update.json", "w"))
          PYEOF
          echo "update.json: $(cat update.json | head -c 200)"

      - name: Upload artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_glob }}
            src-tauri/target/release/bundle/dmg/*.sig
            src-tauri/target/release/bundle/nsis/*.sig
            update.json
          generate_release_notes: true
